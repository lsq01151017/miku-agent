<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>初音未来 · Live2D</title>
<style>
  :root {
    /* 浅色发调:背景取自《モニタリング》Remix 封面发色采样(淡青/淡蓝/淡蓝紫),
       面板是白玻璃 + 2px 墨线 + 硬投影的流行插画语言。颜色按角色锁死:
       青 = 交互与她的数据,钢蓝 = 标签,黄 = LIVE 徽标;墨字墨线。 */
    --pop-ink: #0a0e1a;
    --pop-dim: #4a5a74;
    --pop-steel: #4a6fa5;
    --pop-cyan: #0fb0bf;
    --pop-cyan-soft: #e2f5f6;
    --pop-yellow: #fafe03;
    --pop-panel: rgba(253, 254, 255, 0.9);
    --pop-edge: #0a0e1a;
    --pop-hard: 4px 4px 0 rgba(10, 14, 26, 0.85);
  }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif; color: var(--pop-ink);
    /* 舞台:她站的位置留一团白光,底子是发色的淡青到淡蓝;网点铺在背景层,在她身后,不压在她身上。 */
    background-image:
      radial-gradient(rgba(10, 14, 26, 0.05) 1px, transparent 1px),
      radial-gradient(640px 800px at 34% 62%, rgba(255, 255, 255, 0.85), transparent 62%),
      radial-gradient(520px 420px at 80% 22%, rgba(198, 215, 241, 0.55), transparent 65%),
      linear-gradient(168deg, #cdebea 0%, #dfe6f0 52%, #c6d7f1 100%);
    background-size: 9px 9px, 100% 100%, 100% 100%, 100% 100%;
    background-repeat: repeat, no-repeat, no-repeat, no-repeat;
  }
  /* 指针落在这层透明覆层上,画布自己不接指针:浏览器手里没有能拖的东西,拖动就不会拖出一份跟着鼠标的副本。 */
  canvas { display: block; -webkit-user-drag: none; user-select: none; touch-action: none; }
  #hit {
    position: fixed; inset: 0; z-index: 1; cursor: default; touch-action: none;
    -webkit-user-drag: none; user-select: none;
  }
  /* 「拖动」开关打开后,画面才是一块可以抓的东西。 */
  #hit.armed { cursor: grab; }
  #hit.dragging { cursor: grabbing; }
  /* 覆层盖住整页,面板、输入区、提示要压在它上面才点得到。 */
  #conn, #talk, #why, #bottom, #panel { z-index: 3; }

  .glass {
    background: var(--pop-panel);
    border: 2px solid var(--pop-edge);
    border-radius: 10px;
    -webkit-backdrop-filter: blur(10px) saturate(120%);
    backdrop-filter: blur(10px) saturate(120%);
    box-shadow: var(--pop-hard);
  }

  #conn {
    position: fixed; left: 12px; top: 12px; padding: 4px 12px; border-radius: 999px;
    font: 600 12px/1.6 system-ui, "Microsoft YaHei", sans-serif; color: var(--pop-ink);
  }
  /* 连上后挂 LIVE 徽标:徽标是伪元素,不占 DOM,JS 只管文本与开关。 */
  #conn.on { background: var(--pop-cyan-soft); border-color: var(--pop-cyan); }
  #conn.on::before {
    content: "LIVE";
    display: inline-block; margin-right: 8px; padding: 0 7px;
    background: var(--pop-yellow); border-radius: 6px;
    font: 700 10px/1.6 ui-monospace, monospace; letter-spacing: .14em;
    animation: live-blink 1.6s ease-in-out infinite;
  }
  @keyframes live-blink { 50% { opacity: .55; } }
  #why {
    position: fixed; left: 12px; bottom: 132px; right: 320px; padding: 8px 12px; border-radius: 10px;
    font: 12px/1.7 ui-monospace, monospace; color: #8a1f1a; display: none; white-space: pre-wrap;
    background: #fdecec; border: 2px solid var(--pop-edge);
    box-shadow: 3px 3px 0 rgba(10, 14, 26, 0.85);
  }
  #talk {
    position: fixed; left: 12px; top: 46px; padding: 5px 10px; border-radius: 10px;
    font: 12px/1.7 system-ui, "Microsoft YaHei", sans-serif; color: var(--pop-dim); max-width: 46vw;
  }
  #talk a {
    color: var(--pop-steel); font-weight: 600; text-decoration: underline;
    text-decoration-color: rgba(74, 111, 165, 0.45); text-underline-offset: 3px;
  }

  /* 她的话和我发的话同住底部一栏:字幕在上、输入区在下,顺序固定,字号不变,行间压到最小。 */
  #bottom {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: none;
  }
  #subtitle {
    position: relative;
    width: min(1140px, calc(100vw - 28px)); padding: 8px 16px; border-radius: 10px;
    /* 半透明磨砂,不描墨线:她从字幕后面透出来,模糊把透上来的她揉虚;框会把她隔在外面。 */
    background: rgba(253, 254, 255, 0.72);
    -webkit-backdrop-filter: blur(10px) saturate(120%);
    backdrop-filter: blur(10px) saturate(120%);
    box-shadow: 3px 3px 0 rgba(10, 14, 26, 0.85);
    color: var(--pop-ink); font: 500 15px/1.5 system-ui, "Microsoft YaHei", sans-serif;
    text-align: center; white-space: pre-wrap; word-break: break-word;
    opacity: 0; transition: opacity .18s ease;
    pointer-events: none;
  }
  #subtitle.on { opacity: 1; }

  /* 底部输入区:扁平的;只留最近一句,其余收起,要用时展开。 */
  #composer {
    position: relative; pointer-events: auto;
    width: min(1080px, calc(100vw - 40px)); padding: 7px 10px;
    color: var(--pop-ink); font: 14px/1.5 system-ui, "Microsoft YaHei", sans-serif;
  }
  #composer.hidden { display: none; }
  #mine {
    display: flex; flex-direction: column; gap: 2px; padding: 0 4px;
    font-size: 12px; color: var(--pop-dim); overflow: hidden; max-height: 19px;
  }
  #composer.expanded #mine { max-height: 30vh; overflow-y: auto; padding-bottom: 6px; }
  #mine div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #composer:not(.expanded) #mine div:not(:last-child) { display: none; }
  #composer form { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  #composer input {
    flex: 1; min-width: 0; padding: 8px 12px; border-radius: 8px;
    border: 2px solid var(--pop-edge); background: #ffffff;
    color: var(--pop-ink); font: 14px/1.4 system-ui, "Microsoft YaHei", sans-serif;
  }
  #composer input::placeholder { color: #6b7288; }
  #composer input:focus {
    outline: none; background: var(--pop-cyan-soft);
    box-shadow: 3px 3px 0 rgba(15, 176, 191, 0.55);
  }
  /* 「历史」是文字按钮:下划线式,不占一块牌子。 */
  #btn-history {
    padding: 4px 8px; border: 0; border-bottom: 2px solid rgba(10, 14, 26, 0.35); border-radius: 0;
    background: transparent; box-shadow: none; color: var(--pop-dim); font-size: 11px; font-weight: 600;
  }
  #btn-history:hover { background: transparent; color: var(--pop-steel); border-bottom-color: var(--pop-steel); }
  #panel .more {
    width: 100%; margin-top: 8px; padding: 4px 8px; font-size: 11px; font-weight: 600;
    color: var(--pop-dim); background: #ffffff;
  }
  #panel-more.collapsed { display: none; }
  button {
    padding: 8px 16px; border-radius: 8px; cursor: pointer;
    border: 2px solid var(--pop-edge); background: #ffffff; color: var(--pop-ink);
    font: 600 14px/1.4 system-ui, "Microsoft YaHei", sans-serif;
    box-shadow: 3px 3px 0 rgba(10, 14, 26, 0.85);
    transition: transform .08s ease, box-shadow .08s ease, background .15s ease;
  }
  button:hover { background: var(--pop-cyan); }
  /* 按压是把投影按回去:牌子落进纸面。 */
  button:active { transform: translate(3px, 3px); box-shadow: 0 0 0 rgba(10, 14, 26, 0.85); }

  /* 右侧数值面板:同一套白玻璃。 */
  #panel {
    position: fixed; right: 12px; top: 12px; width: 288px; max-height: calc(100% - 120px);
    overflow-y: auto; padding: 10px 12px 12px;
    color: var(--pop-ink); font: 12px/1.6 system-ui, "Microsoft YaHei", sans-serif;
  }
  #panel h2 {
    margin: 0 0 6px; font-size: 13px; font-weight: 800; color: var(--pop-ink);
    display: flex; justify-content: space-between; align-items: center;
  }
  /* 心情值做成小圆牌:数据来了是「元气」,没来是「—」,同一块牌。 */
  #panel h2 span {
    padding: 0 8px; background: var(--pop-cyan); border: 2px solid var(--pop-edge); border-radius: 999px;
    font: 700 11px/1.6 system-ui, "Microsoft YaHei", sans-serif; color: var(--pop-ink);
  }
  #panel section { margin-top: 10px; }
  #panel .muted { color: var(--pop-dim); }
  .row { display: grid; grid-template-columns: 62px 1fr 44px; gap: 6px; align-items: center; }
  .row .bar { height: 10px; border: 2px solid var(--pop-edge); background: #ffffff; overflow: hidden; }
  .row .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #0fa3b1, #14b8c6); width: 0; }
  .row .num, .ctl .num { text-align: right; font: 700 11px/1.6 ui-monospace, monospace; color: var(--pop-ink); }
  .kv { display: flex; justify-content: space-between; gap: 8px; }
  .kv b { font-weight: 700; color: var(--pop-ink); font-family: ui-monospace, monospace; font-size: 11px; }
  .ctl { margin-top: 8px; }
  .ctl label { display: grid; grid-template-columns: 46px 1fr 52px; gap: 6px; align-items: center; margin-top: 4px; }
  .ctl input[type=range] { width: 100%; accent-color: var(--pop-cyan); }
  .btns { display: flex; gap: 6px; margin-top: 8px; }
  .btns button { flex: 1; padding: 5px 8px; font-size: 12px; }
  .btns button.on { background: var(--pop-cyan); }
  #channels { font: 700 11px/1.5 ui-monospace, monospace; color: var(--pop-dim); }
  #channels div { display: flex; justify-content: space-between; }
</style>
</head>
<body>
<canvas id="stage" draggable="false"></canvas>
<div id="hit"></div>
<div id="conn" class="glass">连接中…</div>
<div id="talk" class="glass">这一页是她的身体。<a href="http://127.0.0.1:18790/" target="_blank">控制台</a>那边是同一个对话。要挪动她：面板「更多」里打开「拖动」，再拖画面。</div>
<div id="why"></div>

<!-- 底部一栏:她的字幕在上,我发过的话与输入框在下。 -->
<div id="bottom">
<div id="subtitle" class="glass"></div>

<div id="composer" class="glass hidden">
  <div id="mine"></div>
  <form id="composer-form" autocomplete="off">
    <input id="composer-input" type="text" placeholder="对她说点什么…" aria-label="对她说点什么">
    <button id="btn-history" type="button" title="展开我发过的话">历史</button>
    <button type="submit">说</button>
  </form>
</div>
</div>

<div id="panel" class="glass">
  <h2>内部状态 <span id="mood">—</span></h2>
  <div id="bars"></div>

  <!-- 数值之下的东西默认收起:面板只留情绪那几条,要看别的按开关。 -->
  <button id="btn-panel" type="button" class="more">更多 ▾</button>
  <div id="panel-more" class="collapsed">
    <section>
      <div class="kv"><span>表情</span><b id="expression">—</b></div>
      <div class="kv"><span>正在做</span><b id="clips">—</b></div>
      <div class="kv"><span>说话中</span><b id="speaking">否</b></div>
      <div class="kv"><span>连着几页</span><b id="clients">0</b></div>
    </section>

    <section>
      <div class="ctl">
        <label>缩放<input id="zoom" type="range" min="30" max="260" value="100"><span class="num" id="zoom-val">100%</span></label>
        <label>左右<input id="offset-x" type="range" min="-400" max="400" value="0"><span class="num" id="offset-x-val">0</span></label>
        <label>上下<input id="offset-y" type="range" min="-400" max="400" value="0"><span class="num" id="offset-y-val">0</span></label>
        <div class="btns">
          <button id="btn-drag" type="button">拖动：关</button>
          <button id="btn-reset" type="button">复位</button>
          <button id="btn-save" type="button">记住</button>
        </div>
      </div>
    </section>

    <section>
      <div class="kv"><span>通道</span><span class="muted">此刻的值</span></div>
      <div id="channels"></div>
    </section>
  </div>
</div>

<!-- 三个库由本扩展的渲染服务从配置的播放器库目录转发;应用脚本在 /app.js。 -->
<script src="/lib/js/pixi.min.js"></script>
<script src="/lib/js/live2dcubismcore.min.js"></script>
<script src="/lib/js/cubism4.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
